<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwiftForms banner (1544x500)</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1544px; height: 500px; overflow: hidden; }
	body {
		font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
		background: linear-gradient(120deg, #1f3aa8 0%, #2b4acb 55%, #5a78e6 100%);
		color: #fff;
		position: relative;
	}
	.mark { position: absolute; left: 110px; top: 86px; width: 84px; height: 84px; }
	h1 { position: absolute; left: 110px; top: 196px; font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
	p { position: absolute; left: 112px; top: 308px; font-size: 38px; line-height: 1.3; width: 640px; color: #e4e9fc; }
	.card { position: absolute; left: 900px; top: 64px; width: 540px; height: 372px; background: #fff; border-radius: 22px; padding: 38px 44px; box-shadow: 0 24px 60px rgba(8, 20, 80, .35); }
	.label { height: 14px; width: 110px; border-radius: 7px; background: #9aa6d9; margin-bottom: 12px; }
	.label.short { width: 80px; }
	.field { height: 46px; border-radius: 10px; border: 2px solid #c9d3f5; margin-bottom: 26px; }
	.field.tall { height: 84px; }
	.row { display: flex; gap: 20px; }
	.row > div { flex: 1; }
	.button { width: 170px; height: 52px; border-radius: 12px; background: #2b4acb; margin-top: 4px; }
	.floater { position: absolute; left: 836px; top: 330px; width: 120px; height: 120px; border-radius: 30px; background: rgba(255, 255, 255, .14); }
	.floater.b { left: 1420px; top: 36px; width: 64px; height: 64px; border-radius: 18px; }
</style>
</head>
<body>
	<div class="floater"></div><div class="floater b"></div>
	<svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
		<rect width="256" height="256" rx="48" fill="#fff"/>
		<rect x="48" y="52" width="160" height="152" rx="18" fill="#2b4acb"/>
		<rect x="68" y="76" width="120" height="16" rx="8" fill="#9bb0f3"/>
		<rect x="68" y="106" width="120" height="16" rx="8" fill="#9bb0f3"/>
		<rect x="68" y="146" width="76" height="34" rx="12" fill="#fff"/>
		<path d="M96 156l16 11-16 11" fill="none" stroke="#2b4acb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
	<h1>SwiftForms</h1>
	<p>Build forms right in the block editor.</p>
	<div class="card" aria-hidden="true">
		<div class="row">
			<div><div class="label"></div><div class="field"></div></div>
			<div><div class="label short"></div><div class="field"></div></div>
		</div>
		<div class="label"></div><div class="field tall"></div>
		<div class="button"></div>
	</div>
</body>
</html>
